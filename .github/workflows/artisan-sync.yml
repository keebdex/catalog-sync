name: Keebdex Artisan Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Runs daily at 23:00 UTC
  # Only changes to the sync code itself warrant an extra production run
  push:
    branches: ['main']
    paths:
      - 'artisans/**'
      - 'utils/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/artisan-sync.yml'

# Two syncs writing the same rows at once would race on inserts and deletes
concurrency:
  group: artisan-sync
  cancel-in-progress: false

env:
  NODE_ENV: production
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  CF_IMAGES_API_KEY: ${{ secrets.CF_IMAGES_API_KEY }}
  CF_IMAGES_ACCOUNT_ID: ${{ secrets.CF_IMAGES_ACCOUNT_ID }}
  CF_IMAGES_ACCOUNT_HASH: ${{ secrets.CF_IMAGES_ACCOUNT_HASH }}
  GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

jobs:
  artisan-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Use latest LTS Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Google service account key
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT" > keebdex.json

      - name: Sync artisan data from Google Docs
        run: npm run gdocs-importer

      - name: Sync artisan data from maker websites/APIs
        run: npm run maker-scraper
