name: Keebdex Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC, an hour after the image sync

concurrency:
  group: backup
  cancel-in-progress: false

env:
  NODE_ENV: production
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_IMAGES_API_KEY: ${{ secrets.CF_IMAGES_API_KEY }}
      CF_IMAGES_ACCOUNT_ID: ${{ secrets.CF_IMAGES_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Use latest LTS Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Back up Cloudflare images to R2
        run: npm run backup-images

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Session pooler URL: GitHub runners have no IPv6 for the direct host
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # pg_dump must be at least the server's major version
      PG_VERSION: 17
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects some of the integrity headers newer AWS CLIs send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Install pg_dump
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$PG_VERSION"

      - name: Dump database
        run: |
          "/usr/lib/postgresql/$PG_VERSION/bin/pg_dump" "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges --file=keebdex.dump
          ls -lh keebdex.dump

      # Daily dumps expire through an R2 lifecycle rule; the dump of the 1st
      # is also kept under monthly/
      - name: Upload dump to R2
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          key="db/daily/$(date -u +%F).dump"
          aws s3 cp keebdex.dump "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint"

          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp keebdex.dump "s3://$R2_BUCKET/db/monthly/$(date -u +%Y-%m).dump" \
              --endpoint-url "$endpoint"
          fi
